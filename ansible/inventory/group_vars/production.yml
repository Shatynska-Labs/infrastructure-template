---
# Variables for the `production` GROUP, which is not the same name as the
# stack whose host it holds: the stack is `main-production` and this file is
# named for the Ansible group, which is the environment axis alone. A second
# tenant's production stack would read this same file, which is what an
# environment-wide baseline means.
#
# THE VAULT-ID LABEL BELOW IS `production` AND FOLLOWS THIS FILE, not the
# stack. The password protects an environment's secrets -- `staging.yml` says
# in as many words that a staging-only operator must not hold production's --
# so the label is on the environment axis too.
#
# The server was created with only a single SSH key and no root
# password (terraform/modules/server/main.tf's own comment: providing a
# key at creation means Hetzner never sets one) -- root is the only
# login this host has. Without this, Ansible defaults to the local
# operator's own username, which fails with "Permission denied".
ansible_user: root

# Non-secret configuration, mirroring
# terraform/stacks/main-production/terraform.tfvars's ssh_allowed_cidrs and
# web_allowed_cidrs exactly -- see ansible/roles/hardening/README.md for
# why these two are hand-kept in sync rather than generated from
# Terraform, and why that matters (they drifted once already: this
# project's UFW rules initially assumed web_allowed_cidrs was unset when
# it was actually already ["0.0.0.0/0"], which would have left the host
# firewall blocking traffic the cloud firewall already permitted).
hardening_ssh_allowed_cidrs:
  - "192.0.2.0/24"
hardening_web_allowed_cidrs:
  - "0.0.0.0/0"

# `deploy_apps` IS NOT HERE, AND MUST NOT BE PUT BACK. The applications a host
# authorises to deploy to it live in that host's own file --
# `host_vars/main-production.yml` for this environment's one host today. An
# entry in THIS file would authorise its key on every host in the environment,
# and an environment may hold two stacks of different tenants; one leaked
# private half must reach one host. See "A Host-Scoped Variable Lives in the
# Host's Own Vars File" (openspec/specs/iac-host-configuration/spec.md).
#
# Writing a third environment's file from scratch: its host's `deploy_apps`
# goes in `host_vars/<server name>.yml`, and `.github/tests` fails the pull
# request if a stack has no such file.

# Operator identities allowed an unprivileged, interactive login on this
# host (add-ops-account). Safe to commit for the same reason deploy_apps's
# entries are: these are public keys, not secrets. Each private half is
# generated out-of-band on the operator's own workstation and never enters
# this repository.
#
# `state` is per-entry and defaults to `present`. To revoke an operator,
# set its `state` to `absent` and LEAVE THE ENTRY HERE until the next
# converge has removed the account -- deleting the entry outright is not
# revocation, it just stops the role from acting on it. See
# ansible/roles/ops_user/README.md.
#
# NOTE: `docker` group membership is root-equivalent by escalation, so this
# is not a boundary against the key holder -- it buys blast-radius
# containment against mistakes, attribution, and revocability. Read the
# role README before adding an entry.
ops_user_accounts:
  - name: ops-claude
    public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKCq6all1TTandgLTLWfHufRg/Y/VTAaWu8813Ft9mW3 ops-claude"

# Subdirectories platform_data_volume creates on the mounted `main` volume
# for platform/docker-compose.yml's Prometheus, Grafana and shared
# PostgreSQL services to bind-mount (add-platform-monitoring, and
# move-the-shared-database-onto-the-data-volume for the third). Owner/group match each image's
# own upstream default user, so no `user:` override is needed in the
# Compose service definitions: 65534/65534 is prom/prometheus's default
# ("nobody"); 472/472 is grafana/grafana's own documented default; 999/999
# is the `postgres` image's own user, which its entrypoint steps down to
# after creating `<major>/docker` beneath this directory as root
# (move-the-shared-database-onto-the-data-volume).
#
# `0755` here rather than the `1777` the image sets on `/var/lib/postgresql`
# in its own filesystem: that mode exists so the image can run as an
# arbitrary uid, which this stack does not do. PGDATA's own `0700` is
# created by `initdb` beneath this directory and is not this entry's
# business.
platform_data_volume_subdirs:
  - path: prometheus
    owner: "65534"
    group: "65534"
    mode: "0755"
  - path: grafana
    owner: "472"
    group: "472"
    mode: "0755"
  - path: postgres
    owner: "999"
    group: "999"
    mode: "0755"

# The path this volume used to be mounted at, removed from /etc/fstab so the
# device is not persisted at two paths across a reboot. Identical to the other
# environment's for the same reason platform_data_volume_subdirs is: both
# stacks mounted at the same path, so both have the same entry to retire.
#
# Inline flow form on one line deliberately -- `.github/tests` exempts the
# retired path from its sweep only where it sits on a line beginning with this
# key, and a block sequence would put the value on a line of its own.
platform_data_volume_superseded_mount_paths: ["/mnt/main-data"]

# ghcr_pull_username is not secret (it's the GitHub account the token
# below belongs to) and is committed in plain text. ghcr_pull_token is a
# genuine secret (a read:packages-scoped GHCR token, tasks.md 2.3:
# generated out-of-band) and is therefore Ansible-Vault-encrypted in place
# below, not plain text -- decrypting it requires the Vault password,
# which is not stored anywhere in this repository (per this project's
# Secrets convention).
ghcr_pull_username: acme
ghcr_pull_token: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  34303536356362636361353761356236393230363638643938346333393636343066626262653236
  6265663530366534333639386362626230306333346461350a343436333834343133313966653432
  61646534623432646662643662626233303566383031626434336531313065653262623337636461
  6536623063633633660a343563613835373630613230343762653938623266653461613530313564
          6461

# STILL TO BE SUPPLIED, and the host-baseline play refuses to converge until
# it is. `image_prune` reports each activation of its scheduled unit to an
# external observer, and a scheduled unit running unobserved is the state that
# reporting exists to end -- so the role asserts this input by name rather than
# defaulting it (openspec/specs/iac-host-configuration/spec.md, "Scheduled Host
# Units Report Their Own Liveness" and "A Role's Absent Required Input Is
# Reported by Name").
#
# It is the same project ping key as the `HEARTBEAT_PING_KEY` repository
# secret, and it is a genuine secret for the same reason `ghcr_pull_token`
# above is: a party who holds it can suppress this alarm by reporting success
# on the unit's behalf. Encrypt it in place, never in plain text:
#
#   ansible-vault encrypt_string --vault-id production@prompt \
#     --name image_prune_heartbeat_ping_key '<key>'
#
# and paste the result here. `docs/bootstrap-a-new-host.md` Appendix A records
# where the key comes from and what each check it addresses needs.
image_prune_heartbeat_ping_key: !vault |
  $ANSIBLE_VAULT;1.2;AES256;production
  33656232353132393832396664343464336531643532353534623433653265396161356430626430
  3438623635616161316566656633313462663166356337380a616130386435353931386366656431
  35343365623964303931663965303461643066633533623639633863313031306166386334356230
  6134353864303761660a383930366336366236326665383664316238643539626439633335316337
          6665
